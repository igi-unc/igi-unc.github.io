name: Sync blog posts

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/blog_config.json"
      - "scripts/sync_posts.py"

permissions:
  contents: write

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Sync IGI posts from Substack cache
        run: python3 scripts/sync_posts.py

      - name: Commit updated feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/posts.json assets/posts/ 2>/dev/null || git add index.html data/posts.json
          if git diff --cached --quiet; then
            echo "No blog changes."
          else
            git commit -m "Refresh IGI blog feed"
            git push
          fi
